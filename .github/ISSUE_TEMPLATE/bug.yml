name: Bug
description: Something broken or confusing in Dasha's open-source tools or docs.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Steps, browser, URL if useful.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: No private keys, seeds, or secrets in this report
          required: true
