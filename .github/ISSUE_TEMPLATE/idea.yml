name: Idea / feature
description: Propose a focused improvement to the Desk.
title: "[Idea]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        What small change would make the Desk clearer, safer, or more reliable?
  - type: textarea
    id: dream
    attributes:
      label: The idea
      description: Describe the smallest useful version.
      placeholder: The Desk should…
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters (optional)
      description: Who is it for, and what becomes easier or safer?
  - type: dropdown
    id: vibe
    attributes:
      label: Rough category (optional)
      options:
        - Not sure
        - Verification / data
        - Accessibility / UX
        - Performance / reliability
        - Docs / contributor experience
  - type: textarea
    id: next
    attributes:
      label: First slice (optional)
      description: Smallest demo or pull request that would prove it.
  - type: textarea
    id: refs
    attributes:
      label: Links (optional)
      description: Mockups, prior art, tweets, related repos.
