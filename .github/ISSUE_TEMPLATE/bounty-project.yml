name: Bounty listing
description: Put a GitHub issue/PR or repo on the dasha bounties board. USDC on Solana. This repo does not hold funds.
title: "[bounty] "
labels: [bounty-project]
body:
  - type: markdown
    attributes:
      value: |
        The board at [getdasha.com/bounties](https://www.getdasha.com/bounties) reads JSON from **open** issues titled `[bounty] …`. Feed: [GitHub Pages](https://uuriko.github.io/dasha-desk/bounties/feed.json) or [raw GitHub](https://raw.githubusercontent.com/Uuriko/dasha-desk/main/bounties/feed.json) (`schema: dasha-bounties-feed/v1`).
  - type: textarea
    id: listing
    attributes:
      label: Listing JSON
      description: Keep this valid JSON. GitHub URL required. payTo is a Solana address or empty.
      render: json
      value: |
        {
          "kind": "item",
          "itemUrl": "https://github.com/owner/name/issues/1",
          "amount": 25,
          "currency": "USDC",
          "chain": "solana",
          "payTo": "",
          "tokenMint": "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v",
          "github": "",
          "x": "",
          "createdAt": "2026-08-13T00:00:00.000Z",
          "outcomes": []
        }
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes (optional)
      description: For the issue thread. The board uses the JSON, not this field.
