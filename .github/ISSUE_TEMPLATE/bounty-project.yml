name: Bounty project listing
description: Put a project on the dasha bounties board. You write the rules. This repo does not hold funds.
title: "[bounty] "
labels: [bounty-project]
body:
  - type: markdown
    attributes:
      value: |
        This issue is the listing. The board at [getdasha.com/bounties](https://www.getdasha.com/bounties/) reads the JSON from **open** issues titled `[bounty] …` (and the `bounty-project` label when GitHub applies it).

        Write your own rules. The board renders them as you typed them. It does not rewrite them into a scoring formula.
  - type: textarea
    id: listing
    attributes:
      label: Listing JSON
      description: Keep this valid JSON. Skip contributor scores — those are fetched live only if you linked a public repo.
      render: json
      value: |
        {
          "name": "my project",
          "repo": "owner/name",
          "blurb": "",
          "pool": { "amount": 50, "currency": "USD" },
          "pays": "What you pay for.",
          "eligibility": "Who can collect.",
          "payout": "How you actually send it.",
          "rules": "Anything else, in your words.",
          "wantScores": true
        }
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes (optional)
      description: For the issue thread. The board uses the JSON, not this field.
