name: patch-watch-home-compute

on:
  push:
    branches: [fix/watch-home-compute]
    paths:
      - '.github/workflows/patch-watch-home-compute.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Patch watch.mjs homepage Compute contract
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'watch.mjs';
          let s = fs.readFileSync(p, 'utf8');
          if (!s.includes('/: missing Compute link')) {
            const needle = "      [/grwm/i, '/: missing grwm'],\n    ],";
            const insert = "      [/grwm/i, '/: missing grwm'],\n      // Must be a real <a> element. The bare href pattern also matched the\n      // CSS selector `a[href=\"/compute\"]` inside the stylesheet that HIDES\n      // Compute, so this check passed while the link was invisible.\n      [/<a\\b[^>]*\\bhref=[\"'](?:https:\\/\\/(?:www\\.)?getdasha\\.com)?\\/compute\\/?[\"'][^>]*>/i, '/: missing Compute link'],\n    ],";
            if (!s.includes(needle)) throw new Error('grwm needle missing');
            s = s.replace(needle, insert);
          }
          if (!s.includes('hidden by a display:none')) {
            const needle = "      warn(b, (html.match(/<h1[\\s>]/gi) || []).length <= 1, '/: Home should have one H1');\n    },";
            const insert = "      warn(b, (html.match(/<h1[\\s>]/gi) || []).length <= 1, '/: Home should have one H1');\n      const hidesCompute = /[^{}]*(?:a\\[href[^\\]]*compute[^\\]]*\\]|\\.compute\\b)[^{}]*\\{[^{}]*display\\s*:\\s*none[^{}]*\\}/i.test(html);\n      fail(b, !hidesCompute, '/: Compute link is hidden by a display:none rule');\n    },";
            if (!s.includes(needle)) throw new Error('h1 warn needle missing');
            s = s.replace(needle, insert);
          }
          fs.writeFileSync(p, s);
          NODE
      - name: Commit if watch.mjs changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watch.mjs
          if git diff --cached --quiet; then
            echo "watch.mjs already patched"
            exit 0
          fi
          git commit -m "Watch: require a visible homepage Compute link"
          git push
