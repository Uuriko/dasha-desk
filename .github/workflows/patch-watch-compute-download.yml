name: patch-watch-compute-download

on:
  push:
    branches: [fix/watch-compute-download]
    paths:
      - '.github/workflows/patch-watch-compute-download.yml'
      - 'watch-compute-release.mjs'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Wire Watch provenance download checks
        run: |
          node <<'NODE'
          const fs = require('fs');
          let s = fs.readFileSync('watch.mjs', 'utf8');
          if (!s.includes("from './watch-compute-release.mjs'")) {
            const needle = "import { fileURLToPath, pathToFileURL } from 'node:url';\n";
            if (!s.includes(needle)) throw new Error('watch.mjs import needle missing');
            s = s.replace(needle, needle + "import { checkComputeRelease } from './watch-compute-release.mjs';\n");
          }
          if (!s.includes('checkComputeRelease(bag, probe')) {
            const needle = "      [/OpenAI-compatible|Ollama|idle Macs/i, '/compute: missing product explanation'],\n    ],\n  });\n";
            if (!s.includes(needle)) throw new Error('watch.mjs compute needle missing');
            s = s.replace(needle, needle + "\n  await checkComputeRelease(bag, probe, { origin: ORIGIN, fail });\n");
          }
          fs.writeFileSync('watch.mjs', s);
          let t = fs.readFileSync('watch.test.mjs', 'utf8');
          if (!t.includes('missing provenance archive')) {
            const needle = "const cli = spawnSync(process.execPath, ['watch.mjs', '--fixture', '--json'], {";
            if (!t.includes(needle)) throw new Error('watch.test.mjs cli needle missing');
            const insert = [
              '{',
              '  const bag = await runWatch({',
              '    probe: overlay(good, {',
              "      [`${ORIGIN}/dasha-compute-open-alpha.tar.gz`]: { status: 404, body: '' },",
              '    }),',
              '    skipPages: true,',
              '  });',
              "  assert.ok(bag.failures.some((f) => /dasha-compute-open-alpha\\.tar\\.gz: missing provenance archive/.test(f)), bag.failures.join('\\n'));",
              '}',
              '',
              '',
            ].join('\n');
            t = t.replace(needle, insert + needle);
          }
          fs.writeFileSync('watch.test.mjs', t);
          NODE
      - name: Commit if Watch files changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watch.mjs watch.test.mjs
          if git diff --cached --quiet; then
            echo "watch already wired"
            exit 0
          fi
          git commit -m "Wire Watch provenance Compute download checks"
          git push
