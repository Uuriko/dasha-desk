name: Watch production

# Manual only. Live getdasha.com currently fails these checks.
# Cron, every-main-push, and watch.mjs edits all mailed a GitHub failure.
# Restore a push trigger only after dasha-lobby is deployed and Watch is green.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Check the live site
        run: node watch.mjs
