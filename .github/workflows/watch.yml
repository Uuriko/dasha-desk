name: Watch production

# Live getdasha.com currently fails these checks (undeployed edge Worker).
# The 6-hour cron plus every main push mailed a GitHub failure on a loop.
# Run by hand until dasha-lobby is deployed; still runs if Watch itself changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - watch.mjs
      - .github/workflows/watch.yml

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Check the live site
        run: node watch.mjs
