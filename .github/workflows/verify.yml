name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Studio
        working-directory: studio
        run: node studio.test.mjs
      - name: Studio embed drift
        working-directory: studio
        run: node embed-build.mjs --check
