name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build drift
        run: node build.mjs --check
      - name: Share unit
        run: node dasha-share.test.mjs
      - name: OSS docs
        run: node dasha-oss-docs.test.mjs
      - name: Mint consistency
        run: node dasha-mint-consistency.test.mjs
      - name: Studio
        working-directory: studio
        run: node studio.test.mjs
      - name: Studio embed drift
        working-directory: studio
        run: node embed-build.mjs --check

