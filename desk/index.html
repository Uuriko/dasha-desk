<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>$dasha desk</title>
<link rel="canonical" href="https://www.getdasha.com/dasha"/>
<link rel="icon" type="image/png" sizes="32x32" href="https://cdn.prod.website-files.com/5f1458122ba25e70a3ff2bd0/6a767a48e1dd29d210f01235_dasha-icon-32.png"/>
<meta name="theme-color" content="#070608"/>
<meta name="robots" content="noindex"/>
<style>
  :root{--ink:#070608;--paper:#f4eddb;--acid:#dfff00;--hot:#ff3b81;--violet:#7c4dff}
  html,body{margin:0;padding:0;background:var(--ink);color:var(--paper);min-height:100%;font-family:Arial,Helvetica,sans-serif}
  .wrap{width:min(1120px,calc(100% - 32px));margin:0 auto;padding:48px 0}
  h1{
    margin:0 0 18px;font-size:clamp(36px,10vw,72px);line-height:.82;
    letter-spacing:-.05em;font-weight:900;text-transform:uppercase;
    font-family:"Arial Black",Arial,Helvetica,sans-serif;
  }
  .cta{
    display:inline-flex;align-items:center;justify-content:center;
    min-height:52px;padding:0 22px;background:var(--acid);color:var(--ink);
    font-family:"Arial Black",Arial,Helvetica,sans-serif;font-weight:900;
    letter-spacing:.06em;text-transform:uppercase;text-decoration:none;
    box-shadow:4px 4px 0 var(--hot);
  }
</style>
<script>
(function(){
  var host=location.hostname;
  var to=(host==='www.getdasha.com'||host==='getdasha.com')?'/dasha':'../';
  location.replace(to);
})();
</script>
</head>
<body>
<main class="wrap">
  <h1>Desk is /dasha.</h1>
  <a class="cta" href="https://www.getdasha.com/dasha">Open desk</a>
</main>
</body>
</html>
